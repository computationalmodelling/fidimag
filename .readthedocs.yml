version: 2

build:
  # ubuntu-20.04 is no longer offered by Read the Docs, and a build asking for
  # it fails before it starts
  os: "ubuntu-26.04"
  tools:
    # mambaforge-* is deprecated and replaced by miniforge3. Pinned rather than
    # `latest` so that a new release of the tool cannot break the build on its
    # own; bump it deliberately
    python: "miniforge3-26.3"

conda:
  environment: doc/environment.yml

sphinx:
  # Path to your Sphinx configuration file.
  configuration: doc/conf.py
